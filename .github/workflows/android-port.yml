name: Android Port

# Google's download servers are unreachable from the dev container, so the
# Android toolchain only exists on the runner. Everything APK-shaped is
# built here.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-port/**'
      - '.github/workflows/android-port.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libffi-dev libssl-dev ccache
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36 setuptools wheel

      - name: Cache buildozer state
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android-port/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android-port/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Build APK
        working-directory: android-port
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build-output.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mcpython-debug-apk
          path: android-port/bin/*.apk
          if-no-files-found: error

      # Keep this last: the job log is read from the tail, so the failure
      # has to be the final thing printed or it scrolls out of reach.
      - name: Failure summary
        if: failure()
        working-directory: android-port
        run: |
          echo "================ LAST 70 LINES ================"
          tail -n 70 build-output.log 2>/dev/null || echo "no build output captured"
          echo "================ ERROR LINES ================"
          grep -inE "error|failed|traceback|not found|no module|cannot|exception" \
            build-output.log 2>/dev/null | tail -n 25 || true
