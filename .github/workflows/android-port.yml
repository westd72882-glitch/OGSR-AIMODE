name: Android Port

# Google's download servers are unreachable from the dev container, so the
# Android toolchain only exists on the runner. Everything APK-shaped is
# built here.
permissions:
  contents: write

concurrency:
  group: android-port
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-port/**'
      - '.github/workflows/android-port.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libffi-dev libssl-dev ccache \
            libltdl-dev m4 gettext
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36 setuptools wheel

      - name: Cache buildozer state
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android-port/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android-port/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Build APK
        working-directory: android-port
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build-output.log

      - name: Name the build
        if: success()
        id: naming
        run: |
          apk=$(ls android-port/bin/*.apk | head -1)
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$apk" | cut -f1)" >> "$GITHUB_OUTPUT"

      # Published as a release rather than an artifact: the artifact quota
      # on this account is used up, and releases do not draw on it.
      - name: Publish APK to Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Minecraft Python for Android - build ${{ github.run_number }}
          prerelease: true
          body: |
            Debug APK from commit ${{ github.sha }}.

            arm64-v8a, minimum Android 7.0 (API 24). Size ${{ steps.naming.outputs.size }}.

            This build reports port readiness on screen: the GL profile the
            device offers, whether the game's Cython modules loaded, and
            whether the pyglet shim resolves.
          files: android-port/bin/*.apk
          fail_on_unmatched_files: true

      # Keep this last: the job log is read from the tail, so the failure
      # has to be the final thing printed or it scrolls out of reach.
      - name: Failure summary
        if: failure()
        working-directory: android-port
        run: |
          echo "================ LAST 70 LINES ================"
          tail -n 70 build-output.log 2>/dev/null || echo "no build output captured"
          echo "================ ERROR LINES ================"
          grep -inE "error|failed|traceback|not found|no module|cannot|exception" \
            build-output.log 2>/dev/null | tail -n 25 || true
