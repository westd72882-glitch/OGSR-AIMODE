name: Android Port

# Google's download servers are unreachable from the dev container, so the
# Android toolchain only exists on the runner. Everything APK-shaped is
# built here.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-port/**'
      - '.github/workflows/android-port.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libffi-dev libssl-dev ccache
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36 setuptools wheel

      - name: Cache buildozer state
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android-port/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android-port/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Build APK
        working-directory: android-port
        run: buildozer -v android debug

      - name: Report result
        if: always()
        working-directory: android-port
        run: |
          echo "--- artifacts produced ---"
          ls -la bin/ 2>/dev/null || echo "no bin/ directory - build did not reach packaging"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mcpython-debug-apk
          path: android-port/bin/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: |
            android-port/.buildozer/android/platform/build-*/build.log
            android-port/.buildozer/**/*.log
          if-no-files-found: ignore
