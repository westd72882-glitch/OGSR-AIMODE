name: Android Port

# Google's download servers are unreachable from the dev container, so the
# Android toolchain only exists on the runner. Everything APK-shaped is
# built here.
permissions:
  contents: write

concurrency:
  group: android-port
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-port/**'
      - '.github/workflows/android-port.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libffi-dev libssl-dev ccache \
            libltdl-dev m4 gettext
          python -m pip install --upgrade pip
          # The game targets Cython 3 (its requirements.txt pins >=3.0.8) and
          # relies on Cython 3's private-name mangling in cdef classes; 0.29
          # misreads self.__flow as the base class's and rejects the call.
          # numpy is needed on the host too: setup.py imports it and the .pyx
          # files cimport its headers during cythonisation.
          # numpy must match the version p4a builds for the target: since
          # Cython 3.1 dropped its bundled numpy pxd, the installed numpy
          # decides the shape of the generated C, and compiling that against
          # a different numpy's headers fails on the 2.x descriptor struct
          # ("no member named 'subarray'").
          pip install buildozer 'cython>=3.0.8' 'numpy==2.3.0' setuptools wheel

      - name: Restore buildozer state
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            android-port/.buildozer
          key: buildozer-${{ runner.os }}-${{ github.run_number }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Build APK
        working-directory: android-port
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build-output.log

      # Runs before the diagnostics below so its ~20s of tar output cannot
      # push the failure summary out of the log tail.
      - name: Save buildozer state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            android-port/.buildozer
          key: buildozer-${{ runner.os }}-${{ github.run_number }}

      - name: Name the build
        if: success()
        id: naming
        working-directory: android-port
        run: |
          apk=$(ls bin/*.apk | head -1)
          echo "size=$(du -h "$apk" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish APK to Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Minecraft Python for Android - build ${{ github.run_number }}
          prerelease: true
          body: |
            Debug APK from commit ${{ github.sha }}.

            arm64-v8a, minimum Android 7.0 (API 24). Size ${{ steps.naming.outputs.size }}.

            This build reports port readiness on screen: the GL profile the
            device offers, whether the game's Cython modules loaded, and
            whether the pyglet shim resolves.
          files: android-port/bin/*.apk
          fail_on_unmatched_files: true

      # Must stay the very last step: the job log is read from its tail, so
      # anything after this buries the failure again.
      - name: Failure summary
        if: failure()
        working-directory: android-port
        run: |
          echo "================ DID P4A CYTHONISE? ================"
          grep -n -A 6 "Running cython where appropriate\|Cythonize \|Trying first build" \
            build-output.log 2>/dev/null | head -n 60 || true
          echo "--- .pyx and .c present in the recipe build dir ---"
          d=$(find .buildozer -type d -name mcgame -path "*other_builds*" 2>/dev/null | head -1)
          echo "dir: $d"
          [ -n "$d" ] && echo "pyx: $(find "$d" -name '*.pyx' | wc -l)  c: $(find "$d" -name '*.c' | wc -l)"
          echo "================ WHAT CYTHONISED THIS ================"
          python3 -c "import numpy, Cython, sys; print('python', sys.version); print('numpy', numpy.__version__, numpy.__file__); print('cython', Cython.__version__)" || true
          echo "--- the offending generated lines ---"
          c=$(find .buildozer -name JavaUtils.c 2>/dev/null | head -1)
          echo "file: $c"
          [ -n "$c" ] && sed -n '23820,23835p' "$c"
          echo "--- does it use the accessor or the raw field? ---"
          [ -n "$c" ] && grep -c "PyDataType_SUBARRAY" "$c"
          [ -n "$c" ] && grep -n -- "->subarray" "$c" | head -5
          echo "================ COMPILE ERRORS (with context) ================"
          grep -n -A 18 "Error compiling Cython file" build-output.log 2>/dev/null \
            | head -n 80 || true
          echo "================ LAST TRACEBACKS ================"
          grep -n -A 14 "Traceback (most recent call last)" build-output.log \
            2>/dev/null | tail -n 60 || true
          echo "================ OTHER ERRORS ================"
          grep -inE "^.*(mcgame:|error:|fatal error|traceback|no module named|undeclared|undefined reference)" \
            build-output.log 2>/dev/null | tail -n 30 || true
