name: Android Port

# Google's download servers are unreachable from the dev container, so the
# Android toolchain only exists on the runner. Everything APK-shaped is
# built here.
permissions:
  contents: write

concurrency:
  group: android-port
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-port/**'
      - '.github/workflows/android-port.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libffi-dev libssl-dev ccache \
            libltdl-dev m4 gettext
          python -m pip install --upgrade pip
          # The game targets Cython 3 (its requirements.txt pins >=3.0.8) and
          # relies on Cython 3's private-name mangling in cdef classes; 0.29
          # misreads self.__flow as the base class's and rejects the call.
          # numpy is needed on the host too: setup.py imports it and the .pyx
          # files cimport its headers during cythonisation.
          # numpy must match the version p4a builds for the target: since
          # Cython 3.1 dropped its bundled numpy pxd, the installed numpy
          # decides the shape of the generated C, and compiling that against
          # a different numpy's headers fails on the 2.x descriptor struct
          # ("no member named 'subarray'").
          pip install buildozer 'cython>=3.0.8' 'numpy==2.3.0' setuptools wheel

      - name: Restore buildozer state
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            android-port/.buildozer
          key: buildozer-${{ runner.os }}-${{ github.run_number }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Build APK
        working-directory: android-port
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build-output.log

      # Runs before the diagnostics below so its ~20s of tar output cannot
      # push the failure summary out of the log tail.
      - name: Save buildozer state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            android-port/.buildozer
          key: buildozer-${{ runner.os }}-${{ github.run_number }}

      - name: Name the build
        if: success()
        id: naming
        working-directory: android-port
        run: |
          apk=$(ls bin/*.apk | head -1)
          echo "size=$(du -h "$apk" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish APK to Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Minecraft Python for Android - build ${{ github.run_number }}
          prerelease: true
          body: |
            Debug APK from commit ${{ github.sha }}.

            arm64-v8a, minimum Android 7.0 (API 24). Size ${{ steps.naming.outputs.size }}.

            This build reports port readiness on screen: the GL profile the
            device offers, whether the game's Cython modules loaded, and
            whether the pyglet shim resolves.
          files: android-port/bin/*.apk
          fail_on_unmatched_files: true

      # Must stay the very last step: the job log is read from its tail, so
      # anything after this buries the failure again.
      # Reading CI logs through the API costs far more than reading a file
      # from the repo, and this runs on every outcome, so the result is
      # always one small file away. ci-status/ is outside the paths filter
      # above, so committing it cannot retrigger the workflow.
      - name: Record the outcome in the repo
        if: always()
        run: |
          summary=/tmp/last-build.md
          {
            echo "# Build ${{ github.run_number }} — ${{ job.status }}"
            echo
            echo "commit: ${{ github.sha }}"
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
          } > "$summary"

          log=android-port/build-output.log
          if [ -f "$log" ]; then
            {
              echo "## Diagnosis (log has $(wc -l < "$log") lines)"
              echo '```'
              # Gradle prints its own failure block; it sits in the middle of
              # the log, far from the tail buildozer leaves behind.
              g=$(grep -n "FAILURE: Build failed" "$log" 2>/dev/null | tail -1 | cut -d: -f1)
              if [ -n "$g" ]; then
                sed -n "${g},$((g + 70))p" "$log"
                echo '--- task/compile errors ---'
                grep -nE "Execution failed for task|^e: |^ *ERROR:|error: |AAPT" "$log" \
                  2>/dev/null | tail -n 25
              else
                # The first build_ext always fails before cythonising, so a
                # missing .c there is normal; only Cython's own errors matter.
                grep -n -A 12 "Error compiling Cython file" "$log" 2>/dev/null | head -n 40
                grep -inE "(fatal error|undeclared|not a supported wheel|Traceback)" \
                  "$log" 2>/dev/null | tail -n 10
                end=$(grep -n "ENVIRONMENT:" "$log" 2>/dev/null | tail -1 | cut -d: -f1)
                if [ -n "$end" ]; then
                  start=$((end > 60 ? end - 60 : 1)); sed -n "${start},${end}p" "$log"
                else
                  tail -n 50 "$log"
                fi
              fi
              echo '```'
              echo
              echo '## Recipe stage'
              echo '```'
              grep -nE "don.t have recipes|were not found as recipes" "$log" 2>/dev/null | tail -n 2
              grep -nE "mcgame: (installing|pre-installing)" "$log" 2>/dev/null | tail -n 4
              d=$(find android-port/.buildozer -type d -name mcgame -path "*other_builds*" 2>/dev/null | head -1)
              [ -n "$d" ] && echo "c files: $(find "$d" -name '*.c' | wc -l)"
              echo '```'
            } >> "$summary"
          fi

          cat "$summary"

          branch="${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          mkdir -p ci-status
          cp "$summary" ci-status/last-build.md
          git add ci-status/last-build.md
          git commit -m "ci: record build ${{ github.run_number }} [skip ci]" || exit 0
          git push origin "HEAD:$branch"
